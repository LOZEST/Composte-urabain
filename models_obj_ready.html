<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenLoop — Modèles 3D</title>
  <meta name="description" content="Visualisez les modèles 3D du projet GreenLoop." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .models-page { max-width: 1200px; margin: 0 auto; padding: 120px 24px 64px; }
    .viewer-card {
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(15,23,42,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .viewer-badges { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .viewer-badge {
      padding: 12px 18px; border-radius: 999px; background: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.8); font-weight: 700; color: #111827;
    }
    .model-stage {
      width: 100%; height: 620px; border-radius: 28px; overflow: hidden; position: relative;
      background:
        radial-gradient(circle at 20% 25%, rgba(126,211,156,0.18), transparent 22%),
        radial-gradient(circle at 78% 30%, rgba(96,165,250,0.15), transparent 20%),
        linear-gradient(180deg, #f6faf6 0%, #eef4ef 100%);
      border: 1px solid rgba(255,255,255,0.9); min-height: 420px;
    }
    #modelCanvas { width: 100%; height: 100%; display: block; }
    .loading-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px; color: #334155; font-weight: 600; pointer-events: none;
    }
    .model-status { margin-top: 16px; color: #475569; font-weight: 500; }
    .model-actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; }
    .model-button {
      display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px;
      border-radius: 999px; text-decoration: none; font-weight: 700;
      border: 1px solid #d1d5db; color: #111827; background: #fff;
    }
    .model-button.primary { background: #14532d; color: #fff; border-color: #14532d; }
    @media (max-width: 900px) {
      .models-page { padding: 100px 16px 48px; }
      .model-stage { height: 420px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-progress" id="topProgress"></div>
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Retour à l'accueil GreenLoop">
        <img src="Logo green loop.JPG" alt="Logo GreenLoop" class="brand-logo" />
        <span>GreenLoop</span>
      </a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html#presentation">Présentation</a>
        <a href="index.html#solution">Solution</a>
        <a href="index.html#conception">Conception</a>
        <a href="models.html" aria-current="page">Modèles 3D</a>
        <a href="index.html#soutiens">Soutiens</a>
        <a href="https://github.com/LOZEST/Composte-urabain/tree/main/CAO" target="_blank" rel="noopener noreferrer">Dossier CAO</a>
      </nav>
    </div>
  </header>

  <main class="models-page">
    <section class="viewer-card">
      <div class="viewer-badges">
        <span class="viewer-badge">Rotation souris</span>
        <span class="viewer-badge">Molette pour zoom</span>
        <span class="viewer-badge">Aperçu 3D OBJ</span>
      </div>

      <div class="model-stage">
        <canvas id="modelCanvas"></canvas>
        <div class="loading-overlay" id="loadingOverlay">Chargement du modèle 3D…</div>
      </div>

      <div class="model-status" id="modelStatus">Préparation du visualiseur…</div>

      <div class="model-actions">
        <a class="model-button primary" href="CAO/assemblage-final.obj" target="_blank" rel="noopener noreferrer">Ouvrir le OBJ</a>
        <a class="model-button" href="index.html">Retour accueil</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

  <script>
    (function () {
      const canvas = document.getElementById("modelCanvas");
      const statusEl = document.getElementById("modelStatus");
      const overlayEl = document.getElementById("loadingOverlay");
      const stageEl = document.querySelector(".model-stage");
      const fileUrl = "CAO/assemblage-final.obj";

      function setStatus(text) { if (statusEl) statusEl.textContent = text; }
      function setOverlay(text) { if (overlayEl) overlayEl.textContent = text; }
      function hideOverlay() { if (overlayEl) overlayEl.style.display = "none"; }

      if (!canvas || !stageEl || !window.THREE) {
        setStatus("Le visualiseur 3D n'a pas pu démarrer.");
        setOverlay("Erreur de chargement du visualiseur.");
        return;
      }

      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
      camera.position.set(180, 120, 180);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      scene.add(new THREE.AmbientLight(0xffffff, 1.8));

      const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
      light1.position.set(220, 220, 220);
      scene.add(light1);

      const light2 = new THREE.DirectionalLight(0xffffff, 1.0);
      light2.position.set(-180, 120, -120);
      scene.add(light2);

      const grid = new THREE.GridHelper(320, 20, 0xb7c5b8, 0xdce5dd);
      grid.position.y = -45;
      scene.add(grid);

      function resize() {
        const width = stageEl.clientWidth || 800;
        const height = stageEl.clientHeight || 600;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      resize();
      window.addEventListener("resize", resize);

      function applyFallbackMaterial(root) {
        root.traverse(function (child) {
          if (child.isMesh) {
            child.material = new THREE.MeshPhongMaterial({
              color: 0x2d7a46,
              shininess: 35,
              specular: 0x2a2a2a,
              side: THREE.DoubleSide
            });
            if (child.geometry) {
              child.geometry.computeVertexNormals();
            }
          }
        });
      }

      function frameObject(root) {
        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        root.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const targetSize = 160;
        const scale = targetSize / maxDim;
        root.scale.setScalar(scale);

        const distance = targetSize * 2.4;
        camera.position.set(distance, distance * 0.72, distance);
        controls.target.set(0, 0, 0);
        controls.update();
      }

      async function loadModel() {
        try {
          setStatus("Téléchargement du OBJ...");
          setOverlay("Chargement du modèle 3D…");

          const response = await fetch(fileUrl, { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);

          const text = await response.text();
          setStatus("Fichier téléchargé, analyse...");

          const loader = new THREE.OBJLoader();
          const object = loader.parse(text);

          applyFallbackMaterial(object);
          scene.add(object);
          frameObject(object);

          hideOverlay();
          setStatus("Modèle chargé avec succès.");
        } catch (error) {
          console.error("Erreur OBJ :", error);
          setStatus("Impossible de charger le modèle 3D : " + error.message);
          setOverlay("Le modèle 3D n'a pas pu être chargé.");
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
      loadModel();
    })();
  </script>
</body>
</html>
