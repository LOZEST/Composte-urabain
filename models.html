<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenLoop — Modèles 3D</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .models-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 120px 24px 64px;
    }

    .viewer-card {
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      backdrop-filter: blur(18px);
    }

    .viewer-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .viewer-badges {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .viewer-badge {
      padding: 12px 18px;
      background: rgba(255,255,255,0.78);
      border-radius: 999px;
      font-weight: 700;
      color: #111827;
    }

    .model-stage {
      width: 100%;
      height: 620px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, #f4faf3 0%, #edf4ef 100%);
      border: 1px solid rgba(255,255,255,0.9);
      position: relative;
    }

    #modelCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .model-status {
      margin-top: 16px;
      color: #374151;
      font-weight: 500;
    }

    .model-actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .model-actions a {
      display: inline-flex;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid #d1d5db;
      color: #111827;
      background: #fff;
    }

    .model-actions a.primary {
      background: #14532d;
      color: #fff;
      border-color: #14532d;
    }

    @media (max-width: 900px) {
      .models-page {
        padding: 96px 16px 40px;
      }

      .model-stage {
        height: 420px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-progress" id="topProgress"></div>
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Retour à l'accueil GreenLoop">
        <img src="Logo green loop.JPG" alt="Logo GreenLoop" class="brand-logo" />
        <span>GreenLoop</span>
      </a>

      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html#presentation">Présentation</a>
        <a href="index.html#solution">Solution</a>
        <a href="index.html#conception">Conception</a>
        <a href="models.html" aria-current="page">Modèles 3D</a>
        <a href="index.html#soutiens">Soutiens</a>
        <a href="https://github.com/LOZEST/Composte-urabain/tree/main/CAO" target="_blank" rel="noopener noreferrer">Dossier CAO</a>
      </nav>
    </div>
  </header>

  <main class="models-page">
    <section class="viewer-card">
      <div class="viewer-toolbar">
        <div>
          <p class="eyebrow">CAO GREENLOOP</p>
          <h1>Visualiser le modèle 3D</h1>
        </div>

        <div class="viewer-badges">
          <span class="viewer-badge">Rotation souris</span>
          <span class="viewer-badge">Molette pour zoom</span>
          <span class="viewer-badge">STL local</span>
        </div>
      </div>

      <div class="model-stage">
        <canvas id="modelCanvas"></canvas>
      </div>

      <div class="model-status" id="modelStatus">Chargement du modèle…</div>

      <div class="model-actions">
        <a href="CAO/assemblage-final.stl" target="_blank" rel="noopener noreferrer" class="primary">Ouvrir le STL</a>
        <a href="https://github.com/LOZEST/Composte-urabain/tree/main/CAO" target="_blank" rel="noopener noreferrer">Ouvrir le dossier CAO</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';
    import { STLLoader } from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/STLLoader.js';

    const canvas = document.getElementById('modelCanvas');
    const statusEl = document.getElementById('modelStatus');

    function setStatus(text) {
      if (statusEl) statusEl.textContent = text;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf2f7f2);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
    camera.position.set(180, 120, 180);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambient);

    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(200, 200, 200);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 0.9);
    light2.position.set(-150, 100, -100);
    scene.add(light2);

    const grid = new THREE.GridHelper(300, 20, 0xb8c4b8, 0xd9e2d9);
    grid.position.y = -40;
    scene.add(grid);

    const axes = new THREE.AxesHelper(60);
    scene.add(axes);

    function resize() {
      const width = canvas.clientWidth || 800;
      const height = canvas.clientHeight || 600;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    resize();
    window.addEventListener('resize', resize);

    const material = new THREE.MeshStandardMaterial({
      color: 0x2f7d4b,
      roughness: 0.65,
      metalness: 0.08
    });

    const loader = new STLLoader();

    loader.load(
      'CAO/assemblage-final.stl',
      (geometry) => {
        geometry.computeVertexNormals();
        geometry.center();
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();

        const mesh = new THREE.Mesh(geometry, material);

        const sphere = geometry.boundingSphere;
        const radius = sphere ? sphere.radius : 50;
        const desiredRadius = 65;
        const scale = desiredRadius / Math.max(radius, 1);

        mesh.scale.setScalar(scale);
        scene.add(mesh);

        const camDistance = desiredRadius * 3.2;
        camera.position.set(camDistance, camDistance * 0.7, camDistance);
        controls.target.set(0, 0, 0);
        controls.update();

        setStatus('Modèle chargé avec succès.');
      },
      (xhr) => {
        if (xhr.total) {
          const percent = ((xhr.loaded / xhr.total) * 100).toFixed(0);
          setStatus(`Chargement du modèle… ${percent}%`);
        } else {
          setStatus('Chargement du modèle…');
        }
      },
      (error) => {
        console.error(error);
        setStatus('Impossible de charger le modèle STL. Vérifie que le fichier existe bien dans CAO/assemblage-final.stl');
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
